name: Windows archived sessions cleanup probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-sessions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4554d80fe12c59935cb846e2d01152aa14042d04

      - name: Assert the exact probe checkout
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "4554d80fe12c59935cb846e2d01152aa14042d04"
          test "$(git rev-parse 'HEAD^')" = "aae7857f0c2141e7d58095ad6991ac598cf57cdf"
          test "$(git rev-parse 'HEAD^{tree}')" = "7c657a339a579e62f2a9cc100182d529801254d7"
          test -z "$(git status --porcelain)"
          printf 'workflow_sha=%s\ncheckout_sha=%s\nsource_tree=%s\nrun_id=%s\nrun_attempt=%s\n' "$WORKFLOW_SHA" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$RUN_ID" "$RUN_ATTEMPT"

      - uses: ./.github/actions/setup
        with:
          build: "@prismshadow/penguin-server..."

      - name: Generate the interface table
        run: pnpm --filter @prismshadow/penguin-server gen:ifaces

      - name: Original server-2 shard (original whole-command retry)
        shell: bash
        run: |
          export ARCHIVED_CLEANUP_COMMAND=1
          pnpm --filter @prismshadow/penguin-server exec vitest run --shard=2/3 && exit 0
          echo "::warning::vitest failed on Windows; retrying once (see the pool-teardown note in ci.yml)"
          export ARCHIVED_CLEANUP_COMMAND=2
          pnpm --filter @prismshadow/penguin-server exec vitest run --shard=2/3
