name: Windows archived sessions diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Original server shard or isolated archived sessions file"
        required: true
        type: choice
        options:
          - shard
          - file

permissions:
  contents: read

jobs:
  archived-sessions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: aae7857f0c2141e7d58095ad6991ac598cf57cdf

      - name: Assert the exact source checkout
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          test "$(git rev-parse HEAD)" = "aae7857f0c2141e7d58095ad6991ac598cf57cdf"
          test "$(git rev-parse 'HEAD^{tree}')" = "447f92ecc8209b3b6e3066d51e36cbe0da7e1c22"
          test -z "$(git status --porcelain)"
          printf 'workflow_sha=%s\ncheckout_sha=%s\nsource_tree=%s\nmode=%s\n' "$WORKFLOW_SHA" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$DIAGNOSTIC_MODE"

      - uses: ./.github/actions/setup
        with:
          build: "@prismshadow/penguin-server..."

      - name: Generate the interface table
        run: pnpm --filter @prismshadow/penguin-server gen:ifaces

      - name: Record tool provenance (separate Node process, not Vitest)
        shell: bash
        run: |
          type -a node pnpm
          node --version
          pnpm --version
          pnpm --filter @prismshadow/penguin-server exec node -e 'console.log(JSON.stringify({version:process.version,execPath:process.execPath,argv:process.argv}))'
          pnpm --filter @prismshadow/penguin-server exec vitest --version

      - name: Original server-2 shard (original whole-command retry)
        if: inputs.mode == 'shard'
        shell: bash
        run: |
          pnpm --filter @prismshadow/penguin-server exec vitest run --shard=2/3 && exit 0
          echo "::warning::vitest failed on Windows; retrying once (see the pool-teardown note in ci.yml)"
          pnpm --filter @prismshadow/penguin-server exec vitest run --shard=2/3

      - name: Isolated archived sessions file (no whole-command retry)
        if: inputs.mode == 'file'
        shell: bash
        run: pnpm --filter @prismshadow/penguin-server exec vitest run test/archived-sessions.test.ts
